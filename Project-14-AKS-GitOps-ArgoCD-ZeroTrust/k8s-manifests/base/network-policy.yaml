apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-only-agw-and-internal
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: zero-trust-web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.1.4.0/24
        - ipBlock:
            cidr: 10.3.0.0/16
        - ipBlock:
            cidr: 192.168.0.0/16
        - ipBlock:
            cidr: 168.63.129.16/32
      ports:
        - protocol: TCP
          port: 80