name: "Project-14 App CI (Build Image & Update GitOps Manifest)"

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'New version tag (e.g. v2.0.0)'
        required: true
        default: 'v2.0.0'

permissions:
  id-token: write
  contents: write

env:
  APP_SRC_DIR: "Project-13-AKS-AGW-ZeroTrust-App/src"
  MANIFEST_FILE: "Project-14-AKS-GitOps-ArgoCD-ZeroTrust/k8s-manifests/base/deployment.yaml"
  IMAGE_NAME: "zero-trust-web"

jobs:
  build-and-update-gitops:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. OIDC login into Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 3. Build and Push Image to Private ACR
        run: |
          ACR_NAME=$(az acr list --resource-group rg-spoke-compute --query "[0].name" -o tsv)
          echo "ACR_NAME=$ACR_NAME" >> $GITHUB_ENV

          az acr update --name "$ACR_NAME" --public-network-enabled true --default-action Allow
          sleep 15

          az acr build \
            --registry "$ACR_NAME" \
            --resource-group rg-spoke-compute \
            --image "${{ env.IMAGE_NAME }}:${{ github.event.inputs.image_tag }}" \
            "${{ env.APP_SRC_DIR }}"

      - name: 3a. Close ACR Firewall (Always)
        if: always() && env.ACR_NAME != ''
        run: |
          az acr update --name "${{ env.ACR_NAME }}" --public-network-enabled false --default-action Deny

      - name: 4. Update Image Tag in GitOps Manifest
        run: |
          sed -i "s|image: .*|image: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.event.inputs.image_tag }}|g" "${{ env.MANIFEST_FILE }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ env.MANIFEST_FILE }}"
          git commit -m "chore(gitops): bump zero-trust-web to ${{ github.event.inputs.image_tag }}"
          git push