name: "Multi-Project CI/CD Terraform Deployment (Manually triggered with the selection of a project folder)"

on:
  workflow_dispatch:
    inputs:
      project_folder:
        description: 'Choose the folder to perform action'
        required: true
        default: 'Project-01-CI-CD-Hub-and-Spoke-Deployment/terraform'
        type: choice
        options:
          - Project-01-CI-CD-Hub-and-Spoke-Deployment/terraform
          - Project-03-Hybrid-SSO-Kerberos-Cloud-Trust-Passwordless-SignIn/terraform
          
      action:
        description: 'Choose the action to perform'
        required: true
        default: 'apply'
        type: choice
        options:
          - apply
          - destroy

permissions:
  id-token: write
  contents: read

jobs:
  security-scan-and-deploy:
    name: "Checkov Scan & Terraform Deploy"
    runs-on: ubuntu-latest

    env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_vm_admin_password: ${{ secrets.TF_VAR_vm_admin_password }}
          

    steps:
      - name: 1. Downloading the code from repository
        uses: actions/checkout@v4

      - name: 2. IaC security scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ github.event.inputs.project_folder }}
          framework: terraform
          # skip_check: CKV2_AZURE_31 # Uncomment for Project-01 | skip 'Ensure VNET subnet is configured with a Network Security Group' check in checkov
          skip_check: CKV_AZURE_50,CKV_AZURE_151 # Uncomment for Project-04 | skip 'Ensure Virtual Machine Extensions are not Installed'
          # & 'Ensure Windows Virtual Machines have enabled encryption at host' check in checkov
          soft_fail: false

      - name: 3. OIDC login into Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 4. Terraform instalation
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: 5. Terraform init
        working-directory: ${{ github.event.inputs.project_folder }}
        run: terraform init

      - name: 6. Terraform plan
        working-directory: ${{ github.event.inputs.project_folder }}
        run: |
          if [ "${{ github.event.inputs.action }}" = "destroy" ]; then
            terraform plan -destroy -out=tfplan
          else
            terraform plan -out=tfplan
          fi

      - name: 7. Terraform apply / destroy
        working-directory: ${{ github.event.inputs.project_folder }}
        run: |
          if [ "${{ github.event.inputs.action }}" = "destroy" ]; then
            terraform destroy -auto-approve
          else
            terraform apply -auto-approve tfplan
          fi
