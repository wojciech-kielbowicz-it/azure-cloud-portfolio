name: "Project-13 CI/CD Terraform Deployment (Manually triggered with the selection of a project folder)"

on:
  workflow_dispatch:
    inputs:
      project_folder:
        description: 'Choose the folder to perform action'
        required: true
        default: 'Project-13-AKS-AGW-ZeroTrust-App'
        type: choice
        options:
          - Project-13-AKS-AGW-ZeroTrust-App

      action:
        description: 'Choose the action to perform'
        required: true
        default: 'apply'
        type: choice
        options:
          - apply
          - destroy

permissions:
  id-token: write
  contents: read

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_vm_admin_password: ${{ secrets.TF_VAR_vm_admin_password }}
  TF_DIR: ${{ github.event.inputs.project_folder }}/terraform
  APP_SRC_DIR: ${{ github.event.inputs.project_folder }}/src
  IMAGE_NAME: "zero-trust-web"
  IMAGE_TAG: "v1.0.0"

jobs:
  plan:
    name: "1. Checkov Scan & Terraform Plan"
    runs-on: ubuntu-latest

    steps:
      - name: 1. Downloading the code from repository
        uses: actions/checkout@v4

      - name: 2. IaC security scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ env.TF_DIR }}
          framework: terraform
          skip_check: CKV_AZURE_41,CKV_AZURE_42,CKV_AZURE_109,CKV_AZURE_110,CKV_AZURE_114,CKV_AZURE_189,CKV2_AZURE_31,CKV2_AZURE_32,CKV_AZURE_120,CKV_AZURE_217,CKV_AZURE_218,CKV_AZURE_160
          soft_fail: false

      - name: 3. OIDC login into Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 3a. Install kubelogin for AKS OIDC Authentication
        run: sudo az aks install-cli

      - name: 3b. Build and Push App Image to Private ACR
        if: github.event.inputs.action == 'apply'
        run: |
          ACR_NAME=$(az acr list --resource-group rg-spoke-compute --query "[0].name" -o tsv)
          echo "Detected Private ACR: $ACR_NAME"
          
          echo "1. Temporarily opening ACR firewall for GitHub Actions..."
          az acr update --name "$ACR_NAME" --public-network-enabled true --default-action Allow
          sleep 15
          
          echo "2. Building and pushing the image..."
          az acr build \
            --registry "$ACR_NAME" \
            --resource-group rg-spoke-compute \
            --image "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" \
            "${{ env.APP_SRC_DIR }}"
            
          echo "3. Closing ACR again..."
          az acr update --name "$ACR_NAME" --public-network-enabled false --default-action Deny

      - name: 4. Terraform installation
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: 5. Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init

      - name: 6. Terraform plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          if [ "${{ github.event.inputs.action }}" = "destroy" ]; then
            terraform plan -destroy -out=tfplan
          else
            terraform plan -out=tfplan
          fi

      - name: 7. Publish Plan to Job Summary
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "### Terraform Plan (${{ github.event.inputs.action }}) for: \`${{ env.TF_DIR }}\`" >> $GITHUB_STEP_SUMMARY
          echo '```terraform' >> $GITHUB_STEP_SUMMARY
          terraform show -no-color tfplan >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 8. Upload tfplan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: ${{ env.TF_DIR }}/tfplan
          retention-days: 1

  execute:
    name: "2. Approve & Execute (${{ github.event.inputs.action }})"
    runs-on: ubuntu-latest
    needs: plan
    environment: production

    steps:
      - name: 1. Downloading the code from repository
        uses: actions/checkout@v4

      - name: 2. Download tfplan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: ${{ env.TF_DIR }}

      - name: 3. OIDC login into Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 3a. Install kubelogin for AKS OIDC Authentication
        run: sudo az aks install-cli

      - name: 4. Terraform installation
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: 5. Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init

      - name: 6. Terraform apply / destroy from approved plan
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve tfplan